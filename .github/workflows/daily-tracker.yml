name: Daily Solana Ecosystem Sync

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Telemetry Tracker
        run: node scripts/tracker.mjs

      - name: Commit and Push Daily Snapshot
        run: |
          git config --global user.name "alqamarzz"
          git config --global user.email "alqamarziaul12@gmail.com"
          
          git add -A
          
          TODAY=$(date -u +"%Y-%m-%d")
          
          if git diff --staged --quiet; then
            echo "No telemetry changes detected today. Skipping commit."
          else
            git commit -m "chore(telemetry): sync solana ecosystem metrics for $TODAY [skip ci]"
            git push origin main
            echo "Successfully pushed daily telemetry snapshot!"
          fi
